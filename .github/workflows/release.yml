name: Build and publish multi-platform release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3)'
        required: true
      name:
        description: 'Release name'
        required: false
      body:
        description: 'Release notes/body'
        required: false

permissions:
  contents: write # Needed for GitHub Releases

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            arch: amd64
            ext: .exe
          - os: windows-latest
            goos: windows
            arch: arm64
            ext: .exe
          - os: ubuntu-latest
            goos: linux
            arch: amd64
            ext: ""
          - os: ubuntu-latest
            goos: linux
            arch: arm64
            ext: ""
          - os: macos-latest
            goos: darwin
            arch: amd64
            ext: ""
          - os: macos-latest
            goos: darwin
            arch: arm64
            ext: ""
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Build embedded binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p release
          BIN_NAME="easysync-${{ matrix.goos }}-${{ matrix.arch }}${{ matrix.ext }}"
          go build -trimpath -ldflags='-s -w' -o "release/${BIN_NAME}" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.name || github.event.inputs.tag }}
          body: ${{ github.event.inputs.body || '' }}
          files: dist/*
          draft: false
          prerelease: false
