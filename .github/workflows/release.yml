name: Build and publish multi-platform release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3)'
        required: true
      name:
        description: 'Release name'
        required: false
      body:
        description: 'Release notes/body'
        required: false

permissions:
  contents: write # Needed for GitHub Releases

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            arch: amd64
            ext: .exe
          - os: windows-latest
            goos: windows
            arch: arm64
            ext: .exe
          - os: ubuntu-latest
            goos: linux
            arch: amd64
            ext: ''
          - os: ubuntu-latest
            goos: linux
            arch: arm64
            ext: ''
          - os: macos-latest
            goos: darwin
            arch: amd64
            ext: ''
          - os: macos-latest
            goos: darwin
            arch: arm64
            ext: ''
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          
      - name: Build backend (with embedded frontend)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p build
          # Windows requires bash shell step below, or we just write a simple script
          BIN_NAME="easysync-${{ github.event.inputs.tag }}-${{ matrix.goos }}-${{ matrix.arch }}${{ matrix.ext }}"
          go build -o "build/$BIN_NAME" .
        shell: bash
          
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.name || github.event.inputs.tag }}
          body: ${{ github.event.inputs.body || '' }}
          files: build/*
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
