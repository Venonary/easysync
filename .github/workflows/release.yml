name: Build and publish multi-platform release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.3)'
        required: true
      name:
        description: 'Release name'
        required: false
      body:
        description: 'Release notes/body'
        required: false

jobs:
  create_release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag }}
          release_name: ${{ github.event.inputs.name || github.event.inputs.tag }}
          body: ${{ github.event.inputs.body || '' }}
          draft: false
          prerelease: false

  build_frontend:
    runs-on: ubuntu-latest
    needs: create_release
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install frontend deps
        run: npm --prefix frontend ci
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: frontend/dist

  package:
    needs: [create_release, build_frontend]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            arch: amd64
            ext: .exe
            archive: zip
          - os: windows-latest
            goos: windows
            arch: arm64
            ext: .exe
            archive: zip
          - os: ubuntu-latest
            goos: linux
            arch: amd64
            ext: ''
            archive: tar.gz
          - os: ubuntu-latest
            goos: linux
            arch: arm64
            ext: ''
            archive: tar.gz
          - os: macos-latest
            goos: darwin
            arch: amd64
            ext: ''
            archive: tar.gz
          - os: macos-latest
            goos: darwin
            arch: arm64
            ext: ''
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'
      - name: Build backend
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p release
          BIN_NAME=easysync
          if [ "${{ matrix.goos }}" = "windows" ]; then BIN_NAME=${BIN_NAME}${{ matrix.ext }}; fi
          go build -o release/${BIN_NAME} .
      - name: Prepare package contents
        run: |
          PKG_DIR=package
          rm -rf $PKG_DIR
          mkdir -p $PKG_DIR
          # copy binary
          if [ "${{ matrix.goos }}" = "windows" ]; then
            cp release/easysync${{ matrix.ext }} $PKG_DIR/
          else
            cp release/easysync $PKG_DIR/
          fi
          # copy dist
          mkdir -p $PKG_DIR/frontend
          cp -r dist/* $PKG_DIR/frontend/
          # include example data and README if present
          if [ -d data ]; then cp -r data $PKG_DIR/; fi
          if [ -f README.md ]; then cp README.md $PKG_DIR/; fi
      - name: Create archive
        id: make_archive
        run: |
          TAG=${{ github.event.inputs.tag }}
          NAME=easysync-${TAG}-${{ matrix.goos }}-${{ matrix.arch }}
          if [ "${{ matrix.archive }}" = "zip" ]; then
            if [ "${{ matrix.os }}" = "windows-latest" ]; then
              powershell -Command "Compress-Archive -Path package\\* -DestinationPath ${NAME}.zip"
            else
              zip -r ${NAME}.zip package
            fi
            echo "archive=${NAME}.zip" >> $GITHUB_OUTPUT
          else
            tar -czf ${NAME}.tar.gz -C package .
            echo "archive=${NAME}.tar.gz" >> $GITHUB_OUTPUT
          fi
      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ needs.create_release.outputs.upload_url }}
          asset_path: ${{ steps.make_archive.outputs.archive }}
          asset_name: ${{ steps.make_archive.outputs.archive }}
          asset_content_type: application/octet-stream
