services:
  easysync:
    build: .
    image: easysync:local
    container_name: easysync
    restart: unless-stopped
    ports:
      - "7788:7788"
    volumes:
      # Move this volume (or bind-mount path) to migrate chat history,
      # uploads, settings, and TLS CA/leaf material to another host.
      - easysync-data:/data
    environment:
      # Optional documentation only; flags in command take effect.
      EASYSYNC_DATA: /data
    # Default HTTP. For HTTPS inside the container:
    # command: ["-addr", ":7788", "-data", "/data", "-https"]
    command: ["-addr", ":7788", "-data", "/data"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7788/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  easysync-data:
    name: easysync-data
