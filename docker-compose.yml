services:
  easysync:
    build: .
    image: easysync:local
    container_name: easysync
    restart: unless-stopped
    ports:
      - "7788:7788"
    volumes:
      # Bind-mount: copy ./data to migrate chat history, uploads,
      # settings, and TLS CA/leaf material to another host.
      - ./data:/data
    environment:
      EASYSYNC_DATA: /data
      EASYSYNC_HTTPS: "true"
    # HTTPS on :7788 — same as bare binary: -https -addr :7788
    command: ["-addr", ":7788", "-data", "/data", "-https"]
    healthcheck:
      # Alpine busybox wget; --no-check-certificate for self-signed / private CA
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://127.0.0.1:7788/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

# Optional named volume alternative (comment bind-mount above, uncomment below):
# volumes:
#   easysync-data:
#     name: easysync-data
